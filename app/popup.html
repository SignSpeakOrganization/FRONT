<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Sign Speak - Reconnaissance LSF</title>
  <link rel="stylesheet" href="styles/popup.css">

  <script type="module" src="scripts/popup-move.js"></script>
  <script type="module" src="scripts/popup-video.js"></script>
</head>
<body>
  <div id="popup" class="draggable-window">
    <header class="popup-header">
      <span class="popup-title">SignSpeak</span>
      <span id="backend-state" class="backend-state">⏳</span>
    </header>

    <div class="popup-video-wrapper">
      <img id="videoFeed" alt="Flux vidéo backend" />
      <div id="videoPlaceholder" class="placeholder">Connexion au backend…</div>
    </div>

    <div class="popup-info">
      <p class="prediction-row">
        <span class="prediction-label">Signe :</span>
        <strong id="prediction">…</strong>
      </p>
      <p class="mode-row">
        <span class="mode-label">Mode :</span>
        <span id="mode">…</span>
      </p>
      <p class="phrase-row">
        <span class="phrase-label">Phrase :</span>
        <span id="phrase"></span>
      </p>
    </div>

    <div class="popup-actions">
      <button id="clearPhrase" type="button">Effacer la phrase</button>
    </div>
  </div>
</body>
</html>
