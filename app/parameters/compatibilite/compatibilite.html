<main class="content">
  <h1>Compatibilité et intégration</h1>

  <section class="section">
    <h2>Liste des plateformes web compatibles</h2>
    <p>Zoom, Google Meet et Teams</p>
    <div class="platforms-logos">
      <img src="../../images/source/zoom-logo.png" alt="Logo Zoom" class="platform-logo">
      <img src="../../images/source/googleMeet-logo.png" alt="Logo Google Meet" class="platform-logo">
      <img src="../../images/source/teams-logo.png" alt="Logo Microsoft Teams" class="platform-logo">
    </div>
  </section>

  <div class="separator"></div>

  <section class="section">
    <h2>État du backend</h2>
    <p class="backend-status">
      <span id="compat-backend-indicator" class="status-dot"></span>
      <span id="compat-backend-label">Vérification…</span>
    </p>
    <p class="backend-meta" id="compat-backend-meta"></p>
    <button id="compat-refresh" type="button" class="file-upload">Rafraîchir</button>
  </section>

  <div class="separator"></div>

  <section class="section">
    <h2>Onglet actif</h2>
    <p>Plateforme détectée : <strong id="compat-current-platform">—</strong></p>
  </section>
</main>
