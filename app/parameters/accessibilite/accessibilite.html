<main class="content">
  <h1>Accessibilité</h1>

  <section class="section">
    <h2>Mode automatique</h2>
    <label class="checkbox-container">
      <p id="auto-mode-label">Activer automatiquement l'extension sur les plateformes de visioconférence compatibles</p>
      <input id="enable-auto-mode" class="checkbox" type="checkbox" />
    </label>
  </section>

  <div class="separator"></div>

  <section>
    <h2>Couleurs</h2>
    <label class="checkbox-container">
      Passer les couleurs de l'extension en noir et blanc
      <input id="enable-bw-mode" class="checkbox" type="checkbox" />
    </label>
  </section>
</main>
